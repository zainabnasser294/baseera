<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Created</title>
<link rel="stylesheet" href="styles.css">
<script>(function(){var t=localStorage.getItem("baseera-theme")||"light";document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("baseera-lang")||"en";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");})();</script>
<script>
 window.BASEERA_TRANSLATIONS = {
  acHeading: { en: 'Account Created !', ar: 'تم إنشاء الحساب!' },
  acSubtitle: { en: 'Welcome to Baseera.', ar: 'مرحبًا بك في بصيرة.' },
  continueBtn: { en: 'Continue', ar: 'متابعة' }
 };
</script>
</head>
<body class="page-enter">

<div class="page">
 <div class="confirm-card" style="margin-top: 60px;">

  <h1 class="confirm-heading" data-i18n="acHeading">Account Created !</h1>
  <p class="confirm-subtitle" data-i18n="acSubtitle">Welcome to Baseera.</p>

  <div class="check-circle-light">
   <svg viewBox="0 0 24 24" fill="none">
    <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
   </svg>
  </div>

  <button class="create-btn" type="button" onclick="window.location.href='onboarding.html'">
   <span data-i18n="continueBtn">Continue</span>
  </button>

 </div>

</div>

<script src="translations.js"></script>
<script src="theme.js"></script>
</body>
</html>
