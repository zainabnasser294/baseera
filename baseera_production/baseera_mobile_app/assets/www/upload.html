<div class="app-shell">
 <div class="app-content">

  <!-- Free Limit Indicator -->

   <input type="file" id="file-input" accept=".xlsx,.xls,.csv,.pdf,.txt,.png,.jpg,.jpeg,image/*,.json" multiple hidden>

  <div class="recent-header" style="display: flex; justify-content: space-between; align-items: center; padding: 0 1.5rem; margin-bottom: 1rem;">

   <a class="recent-see-all" href="#" data-i18n="seeAllBtn" style="font-size: 0.8rem; font-weight: bold; color: #7c6cf0; text-decoration: none;">See all</a>

  <div class="file-list" id="file-list" style="padding: 0 1rem;">
  </div>

  <button class="connect-source" type="button" onclick="openLiveConnectModal()" style="display: flex; align-items: center; justify-content: space-between; margin: 1.5rem 1rem; padding: 1.25rem 1.5rem; background: rgba(255,255,255,0.7); backdrop-filter: blur(24px); border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 4px 15px rgba(27,20,75,0.05); color: #1e293b; font-weight: 900; font-size: 0.9rem; cursor: pointer; text-align: left; width: calc(100% - 2rem); transition: all 0.2s;">
   <span data-i18n="connectSource">+ Connect a live source</span>
   <span style="color: #7c6cf0;">&#8250;</span>
  </button>

 </div>

 <!-- Live Connect Modal -->
 <div id="live-connect-modal" class="modal-overlay" style="display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">

   <input type="text" id="live-sheet-url" placeholder="https://docs.google.com/spreadsheets/..." style="width: calc(100% - 24px); padding: 12px; border-radius: 8px; border: 1px solid var(--color-muted); margin-bottom: 16px; background: transparent; color: var(--color-navy);">

  </div>
 </div>

   </a>

   </a>

<script>
 const dropzone = document.getElementById('dropzone');
 const fileInput = document.getElementById('file-input');
 const browseBtn = document.getElementById('browse-btn');
 const fileList = document.getElementById('file-list');
 const limitIndicator = document.getElementById('limit-text');

 // Limit Logic
 let freeUploads = parseInt(localStorage.getItem('baseera_free_uploads')) || 3;
 if (freeUploads === null) {
   freeUploads = 3;
   localStorage.setItem('baseera_free_uploads', 3);
 } else {
   freeUploads = parseInt(freeUploads);
 }

 function updateLimitUI() {
   const isAr = document.documentElement.lang === 'ar';
   
   // Temporarily hiding the limit UI for testing
   document.getElementById('limit-indicator').style.display = 'none';

   limitIndicator.textContent = isAr 
     ? `${freeUploads}/3 محاولات مجانية متبقية` 
     : `${freeUploads}/3 free uploads remaining`;
     
   // BLOCK REMOVED FOR TESTING
   /*
   if (freeUploads <= 0) {
     dropzone.style.opacity = '0.5';
     dropzone.style.pointerEvents = 'none';
     document.getElementById('limit-indicator').style.border = '1px solid #ef4444';
     limitIndicator.style.color = '#ef4444';
     if(isAr) limitIndicator.textContent = 'انتهت المحاولات المجانية. يرجى الترقية.';
     else limitIndicator.textContent = 'Free uploads exhausted. Please upgrade.';
   }
   */
 }
 updateLimitUI();

 function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
 }

 function fileIconSvg() {
  return '<svg viewBox="0 0 24 24" fill="none"><path d="M7 3h7l5 5v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
 }

 function showUploadedData(dataset) {
  const isAr = (document.documentElement.getAttribute('lang') || 'en') === 'ar';
  const analysisStr = isAr ? 'اكتمل التحليل' : 'Analysis Complete';

  fileList.innerHTML = `
   <div class="file-row" style="background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.2);">
    <div class="file-icon" style="color: #22c55e;">
     <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="file-info">
     <div class="file-name" id="analysis-complete-lbl" style="color: #22c55e;">${analysisStr}</div>
     <div class="file-progress-track"><div class="file-progress-fill" style="width: 100%; background: #22c55e;"></div></div>
    </div>
    <button id="delete-dataset" title="Delete Data" style="background: none; border: none; color: #e0433d; cursor: pointer; padding: 5px;">
     <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
   </div>
  `;

  document.getElementById('delete-dataset').addEventListener('click', () => {
   if(confirm((document.documentElement.lang === 'ar') ? 'هل أنت متأكد من حذف البيانات؟' : 'Are you sure you want to delete data?')) {
    localStorage.removeItem('basira_dataset');
    fileList.innerHTML = '';
   }
  });
 }

 function handleSuccessfulUpload(file, datasetObj) {
  let datasetsList = [];
  try {
   const stored = localStorage.getItem('baseera_datasets_list');
   if (stored) datasetsList = JSON.parse(stored);
  } catch(e) {}
  
  // Add new file to start of datasets list
  datasetsList.unshift(datasetObj);
  localStorage.setItem('baseera_datasets_list', JSON.stringify(datasetsList));
  localStorage.setItem('basira_dataset', JSON.stringify(datasetObj));

  let history = JSON.parse(localStorage.getItem('baseera_upload_history') || '[]');
  history.unshift({ name: file.name, date: new Date().toISOString(), size: file.size });
  if (history.length > 5) history = history.slice(0, 5);
  localStorage.setItem('baseera_upload_history', JSON.stringify(history));

  setTimeout(() => {
   showUploadedData(datasetObj);
  }, 400);
 }

 function addFileToList(file) {
  fileList.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'file-row';
  row.innerHTML = `
   <div class="file-icon">${fileIconSvg()}</div>
   <div class="file-info">
    <div class="file-name">${file.name}</div>
    <div class="file-progress-track"><div class="file-progress-fill" style="width: 0%;"></div></div>
   </div>
   <div class="file-size">${formatSize(file.size)}</div>
  `;
  fileList.prepend(row);

  const fill = row.querySelector('.file-progress-fill');
  fill.style.transition = 'width 0.4s ease';
  fill.style.width = '40%';

  if (window.showLoadingOverlay) {
   window.showLoadingOverlay(document.documentElement.lang === 'ar' ? 'جاري تحليل ومعالجة البيانات...' : 'Analyzing and processing data...');
  }

  const reader = new FileReader();
  const processUpload = (fileText) => {
   const isImage = file.type.startsWith('image/') || file.name.match(/\.(jpg|jpeg|png)$/i);
   const formData = new FormData();
   
   if (isImage) {
     formData.append('receipt_image', file);
   } else {
     formData.append('file', file);
   }

   const endpoint = isImage ? 'http://127.0.0.1:8000/api/mobile/extract-receipt' : 'http://127.0.0.1:8000/api/mobile/upload';

   fetch(endpoint, {
    method: 'POST',
    headers: {
     'Authorization': 'Bearer ' + (localStorage.getItem('basira_token') || '')
    },
    body: formData
   })
   .then(response => response.json())
   .then(data => {
    if (window.hideLoadingOverlay) window.hideLoadingOverlay();
    fill.style.width = '100%';
    fill.style.background = '#22c55e';
    if (data.status === 'success') {
     if (isImage) {
       alert(document.documentElement.lang === 'ar' ? 'تم استخراج بيانات الإيصال بنجاح:\n' + JSON.stringify(data.data, null, 2) : 'Receipt extracted successfully:\n' + JSON.stringify(data.data, null, 2));
       if(fileList.firstChild) fileList.firstChild.remove();
     } else {
       handleSuccessfulUpload(file, data.data);
     }
    } else {
     if (data.message === 'Invalid or expired token') {
      localStorage.removeItem('basira_token');
      window.location.href = 'login.html';
      return;
     }
      alert(data.message || 'Upload failed. Please sign in again.');
    }
   })
   .catch(error => {
    if (window.hideLoadingOverlay) window.hideLoadingOverlay();
    fill.style.width = '100%';
    fill.style.background = '#ef4444';
    alert('Unable to connect to the backend. Please try again.');
   });
  };

  reader.onload = (e) => processUpload(e.target.result);
  reader.onerror = () => processUpload('');

  if (file.type && file.type.includes('text') || file.name.endsWith('.csv') || file.name.endsWith('.txt')) {
   reader.readAsText(file);
  } else {
   reader.readAsArrayBuffer(file);
  }
 }

 function renderDynamicUpload() {
  updateLimitUI();
  const dataStr = localStorage.getItem('basira_dataset');
  if (dataStr) {
   showUploadedData(JSON.parse(dataStr));
  }
 }

 document.addEventListener('DOMContentLoaded', renderDynamicUpload);
 document.addEventListener('langChanged', renderDynamicUpload);

 function handleFiles(fileListObj) {
  Array.from(fileListObj).forEach((file) => addFileToList(file));
 }

 browseBtn.addEventListener('click', () => fileInput.click());
 dropzone.addEventListener('click', () => fileInput.click());
 dropzone.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
   e.preventDefault();
   fileInput.click();
  }
 });

 fileInput.addEventListener('change', (e) => {
  handleFiles(e.target.files);
  fileInput.value = '';
 });

 ['dragenter', 'dragover'].forEach((evt) => {
  dropzone.addEventListener(evt, (e) => {
   e.preventDefault();
   dropzone.classList.add('drag-over');
  });
 });

 ['dragleave', 'drop'].forEach((evt) => {
  dropzone.addEventListener(evt, (e) => {
   e.preventDefault();
   dropzone.classList.remove('drag-over');
  });
 });

 dropzone.addEventListener('drop', (e) => {
  if (e.dataTransfer && e.dataTransfer.files.length) {
   handleFiles(e.dataTransfer.files);
  }
 });

 window.deleteHistoryFile = function(fileName, btn) {
   if(confirm((document.documentElement.lang === 'ar') ? 'هل أنت متأكد من حذف هذا الملف؟' : 'Are you sure you want to delete this file?')) {
     let history = JSON.parse(localStorage.getItem('baseera_upload_history') || '[]');
     history = history.filter(f => f.name !== fileName);
     localStorage.setItem('baseera_upload_history', JSON.stringify(history));
     btn.closest('.advanced-file-card').remove();
     
     if(history.length === 0) {
       fileList.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--color-muted); font-size: 13px;">لا توجد ملفات سابقة (No previous files)</div>`;
     }
   }
 };

 document.querySelector('.recent-see-all').addEventListener('click', (e) => {
  e.preventDefault();
  let history = JSON.parse(localStorage.getItem('baseera_upload_history') || '[]');
  if (history.length === 0) {
    fileList.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--color-muted); font-size: 13px;">لا توجد ملفات سابقة (No previous files)</div>`;
    return;
  }
  fileList.innerHTML = '';
  history.slice(0, 3).forEach(f => {
    const d = new Date(f.date);
    const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    fileList.innerHTML += `
     <div class="advanced-file-card">
      <div class="afc-header">
       <div class="afc-icon">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
       </div>
       <div class="afc-title-area">
        <div class="afc-name">${f.name}</div>
        <div class="afc-meta">
         ${dateStr} &bull; 
         <span style="color:#10b981; display:flex; align-items:center; gap:4px;">
          <span style="width:6px;height:6px;background:#10b981;border-radius:50%;"></span>
          ${document.documentElement.lang === 'ar' ? 'تم تحليله' : 'Analyzed'}
         </span> 
         &bull; CSV
        </div>
       </div>
       <button class="afc-delete" onclick="window.deleteHistoryFile('${f.name}', this);">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
       </button>
      </div>
      <div class="afc-actions">
       <button onclick="window.location.href='insights.html'" class="afc-btn dash-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> 
        ${document.documentElement.lang === 'ar' ? 'لوحة التحكم' : 'Dashboard'}
       </button>
       <button onclick="window.open('http://127.0.0.1:8000/export-excel/', '_blank')" class="afc-btn excel-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        ${document.documentElement.lang === 'ar' ? 'تقرير بصيرة' : 'Baseera Report'}
       </button>
       <button onclick="window.open('http://127.0.0.1:8000/api/user-data.csv', '_blank')" class="afc-btn txt-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        ${document.documentElement.lang === 'ar' ? 'ملخص نصي' : 'Text Note'}
       </button>
       <button onclick="window.downloadRawData()" class="afc-btn dl-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        ${document.documentElement.lang === 'ar' ? 'تنزيل الأصل' : 'Raw Data'}
       </button>
      </div>
     </div>
    `;
  });
 });

 window.downloadRawData = function() {
  const rawData = localStorage.getItem('basira_dataset');
  if (!rawData) {
   alert(document.documentElement.lang === 'ar' ? 'لا توجد بيانات متاحة للتنزيل.' : 'No data available to download.');
   return;
  }
  try {
   const data = JSON.parse(rawData);
   const rows = data.rows || data.sample_data || [];
   if (rows.length === 0) {
     alert(document.documentElement.lang === 'ar' ? 'هذا الملف قديم. يرجى إعادة رفعه مرة أخرى لتتمكني من تنزيل بياناته.' : 'This file is old. Please re-upload it to download the data.');
     return;
   }
   
   const columns = Object.keys(rows[0]);
   let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // BOM for Arabic support
   csvContent += columns.join(",") + "\n";
   
   rows.forEach(row => {
    const rowArray = columns.map(col => {
     let val = row[col];
     if (val === null || val === undefined) val = '';
     return `"${String(val).replace(/"/g, '""')}"`;
    });
    csvContent += rowArray.join(",") + "\n";
   });
   
   const encodedUri = encodeURI(csvContent);
   const link = document.createElement("a");
   link.setAttribute("href", encodedUri);
   link.setAttribute("download", (data.fileName || "raw_data") + ".csv");
   document.body.appendChild(link);
   link.click();
   document.body.removeChild(link);
  } catch(e) {
   console.error(e);
   alert('Error downloading data');
  }
 };

 function openLiveConnectModal() {
  document.getElementById('live-connect-modal').style.display = 'flex';
 }

 function closeLiveConnectModal() {
  document.getElementById('live-connect-modal').style.display = 'none';
 }

 function connectLiveSheet() {
  const urlInput = document.getElementById('live-sheet-url').value.trim();
  if (!urlInput || !urlInput.includes("docs.google.com/spreadsheets")) {
   alert("Please enter a valid Google Sheets URL.");
   return;
  }
  
  // Check limit
  if (freeUploads <= 0) {
   alert("Free upload limit reached. Please upgrade to Pro.");
   return;
  }

  closeLiveConnectModal();
  const loadingHtml = `
   <div class="progress-container">
    <div class="progress-bar-wrap">
     <div class="progress-fill" style="width: 50%;"></div>
    </div>
    <div class="progress-text">Connecting to Live Sheet...</div>
   </div>
  `;
  dropzone.innerHTML = loadingHtml;

  fetch('http://127.0.0.1:8000/api/mobile/connect-live', {
   method: 'POST',
   headers: {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + (localStorage.getItem('basira_token') || '')
   },
   body: JSON.stringify({ sheet_url: urlInput })
  })
  .then(r => r.json())
  .then(data => {
   if (data.status === 'success') {
    localStorage.setItem('baseera_latest_analysis', JSON.stringify(data.data));
    freeUploads--;
    localStorage.setItem('baseera_free_uploads', freeUploads);
    window.location.href = 'insights.html';
   } else {
    alert("Live Connection Error: " + data.message);
    window.location.reload();
   }
  })
  .catch(err => {
   console.error(err);
   alert("Network Error");
   window.location.reload();
  });
 }
</script>
