 <script>
  async function downloadMockNote() {
    const isAr = (document.documentElement.getAttribute('lang') || 'en') === 'ar';
    try {
      const token = localStorage.getItem('basira_token');
      if (!token) {
        showToast(isAr ? 'الرجاء تسجيل الدخول أولاً' : 'Please log in first');
        return;
      }
      showToast(isAr ? 'جاري تحميل الملاحظات...' : 'Downloading notes...');
      const response = await fetch('http://127.0.0.1:8000/api/mobile/export-note', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!response.ok) throw new Error('Failed to download');
      
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "Baseera_Note_Report.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      console.error(e);
      showToast(isAr ? 'فشل التنزيل' : 'Download failed');
    }
  }

  async function downloadMockExcel() {
    const isAr = (document.documentElement.getAttribute('lang') || 'en') === 'ar';
    try {
      const token = localStorage.getItem('basira_token');
      if (!token) {
        showToast(isAr ? 'الرجاء تسجيل الدخول أولاً' : 'Please log in first');
        return;
      }
      showToast(isAr ? 'جاري تصدير التقرير عبر الخادم...' : 'Exporting report via backend...');
      const response = await fetch('http://127.0.0.1:8000/api/mobile/export-excel?lang=' + (isAr ? 'ar' : 'en'), {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!response.ok) throw new Error('Failed to download');
      
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "Baseera_Report.xlsx";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      console.error(e);
      showToast(isAr ? 'فشل التنزيل' : 'Download failed');
    }
  }
