<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Your Mail</title>
<link rel="stylesheet" href="styles.css">
<script>(function(){var t=localStorage.getItem("baseera-theme")||"light";document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("baseera-lang")||"en";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");})();</script>
<script>
 window.BASEERA_TRANSLATIONS = {
  fp2Heading: { en: 'Check your mail', ar: 'تحقق من بريدك' },
  fp2Subtitle: { en: "Enter your email and we'll instantly send you a secure link to reset your password.", ar: 'أدخل بريدك الإلكتروني وسنرسل لك فورًا رابطًا آمنًا لإعادة تعيين كلمة المرور.' },
  fp2RedirectNote: { en: 'Didn\'t get an email? <a href="forgot-password-1.html" style="color:var(--color-navy); font-weight:600;">Try another address</a>', ar: 'لم يصلك بريد؟ <a href="forgot-password-1.html" style="color:var(--color-navy); font-weight:600;">جرّب بريدًا آخر</a>' },
  fp2WaitingNote: { en: 'Waiting for you to click the link in your email...', ar: 'بانتظار نقرك على الرابط في بريدك الإلكتروني...' }
 };
</script>
</head>
<body class="page-enter">

<div class="page">
 <div class="confirm-wrap">

  <div class="fp-icon-wrap" style="color: var(--color-brand);">
   <svg viewBox="0 0 64 64" fill="none">
    <rect x="4" y="16" width="48" height="36" rx="4" fill="currentColor"/>
    <path d="M4 20L28 38L52 20" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="16" r="14" fill="currentColor" stroke="white" stroke-width="2"/>
    <path d="M41 16l4.5 4.5L55 11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
   </svg>
  </div>

  <h1 class="confirm-heading" data-i18n="fp2Heading">Check your mail</h1>
  <p class="confirm-subtitle" data-i18n="fp2Subtitle">Enter your email and we'll instantly send you a secure link to reset your password.</p>

  <p class="redirect-note" id="waiting-note" data-i18n="fp2WaitingNote" style="margin-top: 8px;">Waiting for you to click the link in your email...</p>

  <p class="redirect-note" data-i18n="fp2RedirectNote">Didn't get an email? <a href="forgot-password-1.html" style="color:var(--color-navy); font-weight:600;">Try another address</a></p>

 </div>

</div>

<script src="translations.js"></script>
<script src="theme.js"></script>
<script>
 // In production this page would only advance once the user clicks the
 // real reset link sent to their email. Here we simulate that after a
 // short delay so the flow stays testable without a backend.
 setTimeout(() => {
  window.location.href = 'forgot-password-3.html';
 }, 4000);
</script>
</body>
</html>
