<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<link rel="stylesheet" href="styles.css">
<script>(function(){var t=localStorage.getItem("baseera-theme")||"light";document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("baseera-lang")||"en";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");})();</script>
<script>
 window.BASEERA_TRANSLATIONS = {
  fp1Heading: { en: 'Forgot password?', ar: 'نسيت كلمة المرور؟' },
  fp1Subtitle: { en: 'No worries, we\'ll send you reset instructions.', ar: 'لا تقلق، سنرسل لك تعليمات إعادة التعيين.' },
  labelEmail: { en: 'Email Address', ar: 'البريد الإلكتروني' },
  resetBtn: { en: 'Reset password', ar: 'إعادة تعيين كلمة المرور' },
  backBtn: { en: 'Back', ar: 'رجوع' }
 };
</script>
</head>
<body class="page-enter">

<div class="page">
 <div class="card" style="margin-top: 100px;">

  <button class="back-btn" type="button" onclick="window.location.href='login.html'">
   <span class="back-arrow">&#8592;</span> <span data-i18n="backBtn">Back</span>
  </button>

  <h1 class="heading" style="font-size: 22px;" data-i18n="fp1Heading">Forgot password?</h1>
  <p class="subtitle" data-i18n="fp1Subtitle">Enter your email and we'll send you a secure link to reset your password.</p>

  <form id="forgot-form" novalidate>

   <label class="field-label" for="reset-email" data-i18n="labelEmail">Email Address</label>
   <div class="input-wrap">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 6.5L12 13l8.5-6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <input id="reset-email" type="email" placeholder="" required>
   </div>
   <div class="error-message" id="reset-email-error"></div>

   <button type="submit" class="create-btn">
    <span data-i18n="sendResetBtn">Send reset link <span class="arrow">&#8594;</span></span>
   </button>

   <a class="back-link" href="login.html" data-i18n="backToSignIn">&#8592; Back to sign in</a>

  </form>

 </div>

</div>

<script>
 const forgotForm = document.getElementById('forgot-form');
 forgotForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('reset-email');
  const errorEl = document.getElementById('reset-email-error');
  const isValidEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());

  if (!email.value.trim()) {
   errorEl.textContent = (document.documentElement.lang === 'ar') ? 'الرجاء إدخال بريدك الإلكتروني.' : 'Please enter your email address.';
   email.classList.add('field-error');
   return;
  }
  if (!isValidEmail) {
   errorEl.textContent = (document.documentElement.lang === 'ar') ? 'الرجاء إدخال بريد إلكتروني صحيح.' : 'Please enter a valid email address.';
   email.classList.add('field-error');
   return;
  }

  errorEl.textContent = '';
  email.classList.remove('field-error');
  
  fetch('http://127.0.0.1:8000/api/mobile/forgot-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email.value.trim() })
  })
  .then(r => r.json())
  .then(data => {
    if (data.status === 'success') {
      localStorage.setItem('reset_email', email.value.trim());
      window.location.href = 'forgot-password-2.html';
    } else {
      errorEl.textContent = data.message;
    }
  })
  .catch(err => {
    errorEl.textContent = 'Connection Error';
  });
 });
</script>

<script src="translations.js"></script>
<script src="theme.js"></script>
</body>
</html>
