<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Workspace</title>
<link rel="stylesheet" href="styles.css">
<script>(function(){var t=localStorage.getItem("baseera-theme")||"light";document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("baseera-lang")||"en";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");})();</script>
<script>
 window.BASEERA_TRANSLATIONS = {
  regBack: { en: 'Back', ar: 'رجوع' },
  regHeading: { en: 'Create your workspace', ar: 'أنشئ مساحة عملك' },
  regSubtitle: { en: 'A friendly onboarding - takes under a minute.', ar: 'تسجيل سهل وسريع - أقل من دقيقة.' },
  labelUsername: { en: 'Username (Used for Sign In)', ar: 'اسم المستخدم (يُستخدم لتسجيل الدخول)' },
  labelOwnerName: { en: 'Account Owner Full Name', ar: 'الاسم الكامل لمالك الحساب' },
  labelBusinessName: { en: 'Company / Organization Name', ar: 'اسم الشركة / المؤسسة' },
  labelCrName: { en: 'Commercial Register (CR)', ar: 'رقم السجل التجاري (CR)' },
  labelSector: { en: 'Business Sector', ar: 'قطاع النشاط التجاري' },
  labelEmail: { en: 'Email Address', ar: 'البريد الإلكتروني' },
  labelPhone: { en: 'Phone Number', ar: 'رقم الهاتف' },
  labelPassword: { en: 'Password', ar: 'كلمة المرور' },
  labelConfirmPassword: { en: 'Confirm Password', ar: 'تأكيد كلمة المرور' },
  reenterPassword: { en: 'Re-enter password', ar: 'أعد إدخال كلمة المرور' },
  termsLabel: { en: 'I agree to the terms and privacy policy.', ar: 'أوافق على الشروط وسياسة الخصوصية.' },
  createAccountBtn: { en: 'Create account &#8594;', ar: 'إنشاء حساب &#8592;' },
  signinPrompt: { en: 'Already have an account? <a href="login.html">Sign in</a>', ar: 'لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>' },
  phUsername: { en: 'e.g., ahmed_2026', ar: 'مثال: ahmed_2026' },
  phOwnerName: { en: 'e.g., Ahmed Al-Maamari', ar: 'مثال: أحمد بن سعيد المعمري' },
  phBusinessName: { en: 'e.g., Baseera Solutions', ar: 'مثال: شركة بصيرة للحلول' },
  phCrName: { en: 'e.g., CR-1092837', ar: 'مثال: CR-1092837' }
 };
</script>
</head>
<body class="page-enter">

<div class="page">
 <div class="card">

  <button class="back-btn" type="button" onclick="window.location.href='index.html'">
   <span class="back-arrow">&#8592;</span> <span data-i18n="regBack">Back</span>
  </button>

  <h1 class="heading" data-i18n="regHeading">Create your workspace</h1>
  <p class="subtitle" data-i18n="regSubtitle">A friendly onboarding - takes under a minute.</p>

  <form class="signup-form" id="signup-form" novalidate>

   <!-- Username (Login ID) -->
   <label class="field-label" for="username" data-i18n="labelUsername">Username (Used for Sign In)</label>
   <div class="input-wrap">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
    <input id="username" type="text" placeholder="e.g., ahmed_2026" data-i18n-placeholder="phUsername" pattern="[A-Za-z0-9_.\-]+" required>
   </div>
   <div class="error-message" id="username-error"></div>

   <!-- Owner Full Name -->
   <label class="field-label" for="owner-name" data-i18n="labelOwnerName">Account Owner Full Name</label>
   <div class="input-wrap">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/></svg></span>
    <input id="owner-name" type="text" placeholder="Ahmed Al-Maamari" data-i18n-placeholder="phOwnerName">
   </div>
   <div class="error-message" id="owner-name-error"></div>

   <!-- Business / Company Name -->
   <label class="field-label" for="business-name" data-i18n="labelBusinessName">Company / Organization Name</label>
   <div class="input-wrap">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="17" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
    <input id="business-name" type="text" placeholder="Baseera Solutions" data-i18n-placeholder="phBusinessName" required>
   </div>
   <div class="error-message" id="business-name-error"></div>

   <!-- CR Number -->
   <label class="field-label" for="cr-name" data-i18n="labelCrName">Commercial Register (CR)</label>
   <div class="input-wrap">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="11" r="2" stroke="currentColor" stroke-width="1.8"/><path d="M6 16c0-1.5 1.3-2.5 3-2.5s3 1 3 2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M14 9.5h4M14 12.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
    <input id="cr-name" type="text" placeholder="CR-1092837" data-i18n-placeholder="phCrName" required>
   </div>
   <div class="error-message" id="cr-name-error"></div>

   <label class="field-label" for="sector" data-i18n="labelSector">Business Sector</label>
   <div class="input-wrap" style="position: relative;">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="2" y="7" width="20" height="14" rx="2" ry="2" stroke="currentColor" stroke-width="1.8"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" stroke="currentColor" stroke-width="1.8"/></svg></span>
    <select id="sector" required style="appearance: none; cursor: pointer;">
      <option value="" disabled selected>Select your business sector...</option>
      <option value="pharmacy">Pharmacy</option>
      <option value="real_estate">Real Estate</option>
      <option value="retail">Retail</option>
      <option value="fnb">Food & Beverage (F&B)</option>
      <option value="other">Other</option>
    </select>
    <span class="toggle-password" style="pointer-events: none;"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
   </div>
   <div class="error-message" id="sector-error"></div>

   <label class="field-label" for="email" data-i18n="labelEmail">Email Address</label>
   <div class="input-wrap">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 6.5L12 13l8.5-6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <input id="email" type="email" placeholder="name@company.com" data-i18n-placeholder="phEmail" required>
   </div>
   <div class="error-message" id="email-error"></div>

   <label class="field-label" for="phone" data-i18n="labelPhone">Phone Number</label>
   <div class="input-wrap">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5a1 1 0 011-1h2.2a1 1 0 011 .8l.6 3a1 1 0 01-.3 1L7 10.2a12 12 0 006.8 6.8l1.4-1.5a1 1 0 011-.3l3 .6a1 1 0 01.8 1V19a1 1 0 01-1 1C10.6 20 4 13.4 4 5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
    <input id="phone" type="tel" placeholder="+968 9123 4567" data-i18n-placeholder="phPhone" required>
   </div>
   <div class="error-message" id="phone-error"></div>

   <label class="field-label" for="password" data-i18n="labelPassword">Password</label>
   <div class="input-wrap">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor"/></svg></span>
    <input id="password" type="password" placeholder="••••••••" data-i18n-placeholder="phPassword" required minlength="8" oninput="evalMobileStrength(this.value)">
    <button type="button" class="toggle-password" data-target="password" aria-label="Show password"></button>
   </div>
   <!-- Password Strength Indicator Bar -->
   <div style="margin-top: 6px; padding: 0 4px;">
     <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; margin-bottom: 4px;">
       <span style="color: #64748B;">Password strength:</span>
       <span id="mobStrengthText" style="color: #94A3B8;">Incomplete</span>
     </div>
     <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; height: 6px; background: #E2E8F0; border-radius: 999px; padding: 2px;">
       <div id="mBar1" style="height: 100%; border-radius: 999px; background: #CBD5E1; transition: all 0.3s ease;"></div>
       <div id="mBar2" style="height: 100%; border-radius: 999px; background: #CBD5E1; transition: all 0.3s ease;"></div>
       <div id="mBar3" style="height: 100%; border-radius: 999px; background: #CBD5E1; transition: all 0.3s ease;"></div>
       <div id="mBar4" style="height: 100%; border-radius: 999px; background: #CBD5E1; transition: all 0.3s ease;"></div>
     </div>
   </div>
   <div class="error-message" id="password-error"></div>

   <label class="field-label" for="confirm-password" data-i18n="labelConfirmPassword">Confirm Password</label>
   <div class="input-wrap">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor"/></svg></span>
    <input id="confirm-password" type="password" placeholder="••••••••" data-i18n-placeholder="phPassword" required>
    <button type="button" class="toggle-password" data-target="confirm-password" aria-label="Show password"></button>
   </div>
   <div class="error-message" id="confirm-password-error"></div>

   <label class="terms">
    <input type="checkbox" id="terms" required>
    <span data-i18n="termsLabel">I agree to the terms and privacy policy.</span>
   </label>
   <div class="error-message" id="terms-error"></div>

   <button type="submit" class="create-btn">
    <span data-i18n="createAccountBtn">Create account <span class="arrow">&#8594;</span></span>
   </button>

   <p class="signin-link" data-i18n="signinPrompt">Already have an account? <a href="login.html">Sign in</a></p>

  </form>

 </div>

</div>

<script src="script.js"></script>
<script src="translations.js"></script>
<script src="theme.js"></script>
<script>
function evalMobileStrength(val) {
  const textEl = document.getElementById('mobStrengthText');
  const b1 = document.getElementById('mBar1');
  const b2 = document.getElementById('mBar2');
  const b3 = document.getElementById('mBar3');
  const b4 = document.getElementById('mBar4');
  
  const def = "height: 100%; border-radius: 999px; background: #CBD5E1; transition: all 0.3s ease;";
  b1.style.cssText = def;
  b2.style.cssText = def;
  b3.style.cssText = def;
  b4.style.cssText = def;

  if (!val) {
    textEl.textContent = 'Incomplete';
    textEl.style.color = '#94A3B8';
    return;
  }

  let score = 0;
  if (val.length >= 6) score++;
  if (val.length >= 8 && /[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;

  if (score <= 1) {
    textEl.textContent = 'Weak';
    textEl.style.color = '#EF4444';
    b1.style.background = '#EF4444';
  } else if (score === 2) {
    textEl.textContent = 'Fair';
    textEl.style.color = '#F59E0B';
    b1.style.background = '#F59E0B';
    b2.style.background = '#F59E0B';
  } else if (score === 3) {
    textEl.textContent = 'Good';
    textEl.style.color = '#3B82F6';
    b1.style.background = '#3B82F6';
    b2.style.background = '#3B82F6';
    b3.style.background = '#3B82F6';
  } else {
    textEl.textContent = 'Strong';
    textEl.style.color = '#10B981';
    b1.style.background = '#10B981';
    b2.style.background = '#10B981';
    b3.style.background = '#10B981';
    b4.style.background = '#10B981';
  }
}
</script>
</body>
</html>
