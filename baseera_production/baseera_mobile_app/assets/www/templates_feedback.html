<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Feedback | الآراء والملاحظات</title>
<link rel="stylesheet" href="styles.css">
<script>(function(){var t=localStorage.getItem("baseera-theme")||"light";document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("baseera-lang")||"en";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");})();</script>
<script>
 window.BASEERA_TRANSLATIONS = {
  feedbackTitle: { en: 'Feedback', ar: 'النماذج وتقييم الخدمة' },
  feedbackDesc: { en: 'Share your feedback, ratings, or custom template requests to empower AI models.', ar: 'شاركنا تجربتك، تقييمك، أو طلبات النماذج المخصصة لمساعدة فريق بصيرة.' },
  submitFeedback: { en: 'Submit New Feedback', ar: 'تقديم تقييم أو ملاحظة جديدة' },
  feedbackType: { en: 'Feedback Type', ar: 'نوع الملاحظة أو الطلب' },
  optRating: { en: 'Platform Rating', ar: 'تقييم المنصة' },
  optSuggestion: { en: 'Feature Suggestion', ar: 'اقتراح ميزة' },
  optComplaint: { en: 'Inquiry', ar: 'استفسار' },
  emailField: { en: 'Email Address', ar: 'البريد الإلكتروني' },
  ratingField: { en: 'Rating (1 to 5 Stars)', ar: 'التقييم (1 إلى 5 نجوم)' },
  messageField: { en: 'Message Details', ar: 'تفاصيل الملاحظة' },
  submitBtn: { en: 'Submit Feedback', ar: 'إرسال التقييم' }
 };
</script>
</head>
<body class="page-enter">

<div class="app-shell">
 <div class="app-content">

  <div class="settings-topbar" style="padding: 16px 20px 6px;">
   <button class="icon-back-btn" onclick="window.history.back()" title="Back">
    <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
   </button>
   <div class="settings-heading" data-i18n="feedbackTitle">Feedback</div>
  </div>

  <div style="padding: 1rem; display: flex; flex-direction: column; gap: 1rem; padding-bottom: 5rem;">

   <!-- Header Card -->
   <div style="background: rgba(255,255,255,0.7); backdrop-filter: blur(24px); border-radius: 1.5rem; padding: 1.25rem; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 4px 15px rgba(27,20,75,0.05);">
     <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
       <div style="width: 2.5rem; height: 2.5rem; background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%); border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; color: white;">
         <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
       </div>
       <div data-i18n="feedbackTitle" style="font-size: 1rem; font-weight: 900; color: #1e293b;">Feedback</div>
     </div>
     <div data-i18n="feedbackDesc" style="font-size: 0.65rem; color: #64748b; line-height: 1.4;">Share your feedback, ratings, or custom template requests to empower AI models.</div>
   </div>

   <!-- Form Card -->
   <div style="background: rgba(255,255,255,0.9); backdrop-filter: blur(24px); border-radius: 1.5rem; padding: 1.25rem; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 4px 20px rgba(14,165,233,0.1);">
     <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.75rem;">
       <div style="width: 2rem; height: 2rem; background: #e0f2fe; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; color: #0284c7;">
         <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
       </div>
       <div data-i18n="submitFeedback" style="font-size: 0.85rem; font-weight: 900; color: #1e293b;">Submit New Feedback</div>
     </div>

     <form onsubmit="submitForm(event)" style="display: flex; flex-direction: column; gap: 1rem;">
       
       <div>
         <label data-i18n="feedbackType" style="font-size: 0.7rem; font-weight: bold; color: #475569; margin-bottom: 0.25rem; display: block;">Feedback Type</label>
         <select style="width: 100%; padding: 0.75rem; border-radius: 1rem; border: 1px solid #e2e8f0; font-size: 0.75rem; font-weight: bold; background: #f8fafc; color: #1e293b; outline: none;">
           <option data-i18n="optRating">Platform Rating</option>
           <option data-i18n="optSuggestion">Feature Suggestion</option>
           <option data-i18n="optComplaint">Inquiry</option>
         </select>
       </div>

       <div>
         <label data-i18n="emailField" style="font-size: 0.7rem; font-weight: bold; color: #475569; margin-bottom: 0.25rem; display: block;">Email Address</label>
         <input type="email" placeholder="example@domain.com" required style="width: 100%; padding: 0.75rem; border-radius: 1rem; border: 1px solid #e2e8f0; font-size: 0.75rem; font-weight: bold; background: #f8fafc; color: #1e293b; outline: none; box-sizing: border-box;">
       </div>

       <div>
         <label data-i18n="ratingField" style="font-size: 0.7rem; font-weight: bold; color: #475569; margin-bottom: 0.25rem; display: block;">Rating (1 to 5 Stars)</label>
         <div style="display: flex; gap: 0.5rem; background: #f8fafc; padding: 0.5rem; border-radius: 1rem; border: 1px solid #e2e8f0;">
           <span class="star" style="color: #fbbf24; cursor: pointer; font-size: 1.5rem;" onclick="setRating(1)">★</span>
           <span class="star" style="color: #fbbf24; cursor: pointer; font-size: 1.5rem;" onclick="setRating(2)">★</span>
           <span class="star" style="color: #fbbf24; cursor: pointer; font-size: 1.5rem;" onclick="setRating(3)">★</span>
           <span class="star" style="color: #fbbf24; cursor: pointer; font-size: 1.5rem;" onclick="setRating(4)">★</span>
           <span class="star" style="color: #fbbf24; cursor: pointer; font-size: 1.5rem;" onclick="setRating(5)">★</span>
         </div>
       </div>

       <div>
         <label data-i18n="messageField" style="font-size: 0.7rem; font-weight: bold; color: #475569; margin-bottom: 0.25rem; display: block;">Message Details</label>
         <textarea rows="4" required style="width: 100%; padding: 0.75rem; border-radius: 1rem; border: 1px solid #e2e8f0; font-size: 0.75rem; font-weight: bold; background: #f8fafc; color: #1e293b; outline: none; box-sizing: border-box; resize: none;"></textarea>
       </div>

       <button type="submit" style="width: 100%; padding: 0.8rem; border-radius: 1rem; border: none; background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%); color: white; font-weight: 900; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; box-shadow: 0 4px 10px rgba(14,165,233,0.3); margin-top: 0.5rem;">
         <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
         <span data-i18n="submitBtn">Submit Feedback</span>
       </button>

     </form>
   </div>

  </div>

 </div>
 <nav class="bottom-nav">
   <a href="dashboard.html" class="" title="الرئيسية">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
   </a>
   <a href="insights.html" class="" title="التحليلات">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
   </a>
   <a href="chat.html" class="" title="اسأل بصيرة" style="position: relative; top: -5px; background: linear-gradient(135deg, #2b2470 0%, #7c6cf0 100%); color: white; border-radius: 50%; padding: 8px; box-shadow: 0 2px 8px rgba(124,108,240,0.4);">
    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M4 4h16a1 1 0 011 1v11a1 1 0 01-1 1H8l-4 4V5a1 1 0 011-1z"/></svg>
   </a>
   <a href="datasets.html" class="" title="البيانات">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
   </a>
   <a href="reports.html" class="" title="التقارير">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
   </a>
  </nav>
</div>

<script src="app.js"></script>
<script src="translations.js"></script>
<script src="theme.js"></script>
<script>
 function renderDate() {
  const isAr = (document.documentElement.getAttribute('lang') || 'en') === 'ar';
  const dayEl = document.getElementById('dash-day-label');
  if (dayEl) {
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    dayEl.textContent = new Date().toLocaleDateString(isAr ? 'ar-SA' : 'en-US', options);
  }
 }

 function setRating(val) {
   const stars = document.querySelectorAll('.star');
   stars.forEach((s, idx) => {
     if (idx < val) s.style.color = '#fbbf24';
     else s.style.color = '#cbd5e1';
   });
 }

 function submitForm(e) {
   e.preventDefault();
   alert("Feedback submitted successfully!");
   e.target.reset();
   setRating(5);
 }

 document.addEventListener('DOMContentLoaded', renderDate);
 document.addEventListener('langChanged', renderDate);
</script>
</body>
</html>
