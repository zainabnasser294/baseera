<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Finance</title>
<link rel="stylesheet" href="styles.css">
<script>(function(){var t=localStorage.getItem("baseera-theme")||"light";document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("baseera-lang")||"en";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");})();</script>
<style>
 .admin-header-card {
  background: var(--color-card);
  border-radius: 20px;
  padding: 20px;
  margin: 0 20px 16px;
  border: var(--card-border);
  box-shadow: var(--card-shadow);
  display: flex;
  flex-direction: column;
  gap: 16px;
 }
 .admin-header-top {
  display: flex;
  align-items: center;
  gap: 12px;
 }
 .admin-icon-box {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: rgba(16, 185, 129, 0.1);
  color: #10b981;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
 }
 .admin-header-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--color-navy);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
 }
 .admin-header-desc {
  font-size: 12px;
  color: var(--color-muted);
  line-height: 1.4;
 }
 
 .finance-hero {
  background: linear-gradient(135deg, #059669, #10b981);
  border-radius: 16px;
  padding: 20px;
  color: white;
  margin: 0 20px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
 }
 
 .finance-label {
  font-size: 10px;
  text-transform: uppercase;
  font-weight: 700;
  opacity: 0.8;
  margin-bottom: 4px;
 }
 .finance-amount {
  font-size: 28px;
  font-weight: 900;
 }
 
 .invoice-card {
  background: var(--color-card);
  border-radius: 20px;
  padding: 16px;
  margin: 0 20px 12px;
  border: var(--card-border);
  box-shadow: var(--card-shadow);
 }
 .invoice-header {
  font-size: 14px;
  font-weight: 800;
  color: var(--color-navy);
  margin-bottom: 12px;
 }
 
 .invoice-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  margin-bottom: 12px;
 }
 .invoice-row:last-child {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
 }
 .invoice-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(16, 185, 129, 0.1);
  color: #10b981;
  display: flex;
  align-items: center;
  justify-content: center;
 }
 
 .invoice-info {
  flex: 1;
 }
 .invoice-user {
  font-size: 12px;
  font-weight: bold;
  color: var(--color-navy);
  margin-bottom: 2px;
 }
 .invoice-id {
  font-size: 10px;
  color: var(--color-muted);
  font-family: monospace;
 }
 .invoice-amount {
  font-size: 14px;
  font-weight: 800;
  color: #10b981;
 }
 
</style>
</head>
<body class="page-enter">

 <div class="app-content">

   <div>
    <div class="dash-greeting">المالية والفواتير</div>

    </button>
    <button class="dash-icon-btn lang-toggle-pill" title="Toggle language" style="height: 32px; padding: 0 10px; justify-content: center; font-size: 0.75rem; font-weight: bold; border-radius: 16px;">
     <span class="lang-toggle-label">Eng/ع</span>
    </button>
   </div>
  </div>

  <!-- Header -->
  <div class="admin-header-card">
   <div class="admin-header-top">

     <svg viewBox="0 0 24 24" fill="none" width="24" height="24"><rect x="2" y="6" width="20" height="12" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 12h.01M18 12h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
     <div class="admin-header-title">المالية والفواتير</div>

  </div>

  <!-- Hero Card -->
  <div class="finance-hero">
   <div>
    <div class="finance-label">إجمالي الإيرادات (Total Revenue)</div>
    <div class="finance-amount">0.00 <span style="font-size: 14px; font-weight: normal; opacity: 0.8;">OMR</span></div>
   </div>
   <div style="background: rgba(255,255,255,0.2); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
    <svg viewBox="0 0 24 24" fill="none" width="24" height="24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="16 7 22 7 22 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
   </div>
  </div>

  <!-- Invoices List -->
  <div class="invoice-card">
   <div class="invoice-header">سجل المدفوعات (Payment History)</div>
   
   <!-- Placeholder empty state, or loop items if there are any -->
   <div style="text-align: center; padding: 24px 0;">
    <svg viewBox="0 0 24 24" fill="none" width="32" height="32" style="color: var(--color-muted); margin: 0 auto 8px; opacity: 0.5;"><rect x="2" y="6" width="20" height="12" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p style="font-size: 12px; color: var(--color-muted);">لا توجد مدفوعات مسجلة حتى الآن.</p>
   </div>

  </div>

 </div>
