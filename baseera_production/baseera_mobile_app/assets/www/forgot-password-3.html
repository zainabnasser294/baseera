<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create New Password</title>
<link rel="stylesheet" href="styles.css">
<script>(function(){var t=localStorage.getItem("baseera-theme")||"light";document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("baseera-lang")||"en";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");})();</script>
<script>
 window.BASEERA_TRANSLATIONS = {
  fp3Heading: { en: 'Create new password', ar: 'إنشاء كلمة مرور جديدة' },
  fp3Subtitle: { en: 'Your new password must be different from the previous used password.', ar: 'يجب أن تختلف كلمة المرور الجديدة عن كلمة المرور المستخدمة سابقًا.' },
  labelPassword: { en: 'Password', ar: 'كلمة المرور' },
  labelConfirmPassword: { en: 'Confirm Password', ar: 'تأكيد كلمة المرور' },
  reenterPassword: { en: 'Re-enter password', ar: 'أعد إدخال كلمة المرور' },
  continueBtn: { en: 'Continue', ar: 'متابعة' },
  backBtn: { en: 'Back', ar: 'رجوع' }
 };
</script>
</head>
<body class="page-enter">

<div class="page">
 <div class="card" style="margin-top: 100px;">

  <button class="back-btn" type="button" onclick="window.location.href='login.html'">
   <span class="back-arrow">&#8592;</span> <span data-i18n="backBtn">Back</span>
  </button>

  <h1 class="heading" style="font-size: 22px;" data-i18n="fp3Heading">Create new password</h1>
  <p class="subtitle" data-i18n="fp3Subtitle">Your new password must be different from the previous used password.</p>

  <form id="new-password-form" novalidate>

   <label class="field-label" for="otp-code">Verification Code (OTP)</label>
   <div class="input-wrap">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="1.8"/></svg></span>
    <input id="otp-code" type="text" placeholder="Enter 6-digit code" required>
   </div>
   <div class="error-message" id="otp-code-error"></div>

   <label class="field-label" for="new-password" data-i18n="labelPassword">Password</label>
   <div class="input-wrap">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor"/></svg></span>
    <input id="new-password" type="password" placeholder="" required minlength="8">
    <button type="button" class="toggle-password" data-target="new-password" aria-label="Show password">&#128065;</button>
   </div>
   <div class="error-message" id="new-password-error"></div>

   <label class="field-label" for="confirm-new-password" data-i18n="labelConfirmPassword">Confirm Password</label>
   <div class="input-wrap">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor"/></svg></span>
    <input id="confirm-new-password" type="password" placeholder="Re-enter password" data-i18n-placeholder="reenterPassword" required>
    <button type="button" class="toggle-password" data-target="confirm-new-password" aria-label="Show password">&#128065;</button>
   </div>
   <div class="error-message" id="confirm-new-password-error"></div>

   <button type="submit" class="create-btn">
    <span data-i18n="continueBtn">Continue</span>
   </button>

  </form>

 </div>

</div>

<script src="script.js"></script>
<script>
 function arErr(ar, en) { return (document.documentElement.lang === 'ar') ? ar : en; }
 const newPasswordForm = document.getElementById('new-password-form');
 newPasswordForm.addEventListener('submit', (e) => {
  e.preventDefault();

  const newPassword = document.getElementById('new-password');
  const confirmNewPassword = document.getElementById('confirm-new-password');
  const newPasswordError = document.getElementById('new-password-error');
  const confirmNewPasswordError = document.getElementById('confirm-new-password-error');

  newPassword.classList.remove('field-error');
  confirmNewPassword.classList.remove('field-error');
  newPasswordError.textContent = '';
  confirmNewPasswordError.textContent = '';

  let isValid = true;

  if (!newPassword.value) {
   newPasswordError.textContent = arErr('الرجاء إدخال كلمة مرور جديدة.', 'Please enter a new password.');
   newPassword.classList.add('field-error');
   isValid = false;
  } else if (newPassword.value.length < 8) {
   newPasswordError.textContent = arErr('يجب ألا تقل كلمة المرور عن 8 أحرف.', 'Password must be at least 8 characters.');
   newPassword.classList.add('field-error');
   isValid = false;
  }

  if (!confirmNewPassword.value) {
   confirmNewPasswordError.textContent = arErr('الرجاء تأكيد كلمة المرور الجديدة.', 'Please confirm your new password.');
   confirmNewPassword.classList.add('field-error');
   isValid = false;
  } else if (confirmNewPassword.value !== newPassword.value) {
   confirmNewPasswordError.textContent = arErr('كلمتا المرور غير متطابقتين.', 'Passwords do not match.');
   confirmNewPassword.classList.add('field-error');
   isValid = false;
  }

  if (isValid) {
   const email = localStorage.getItem('reset_email');
   if (!email) {
     alert('Session expired. Please start over.');
     window.location.href = 'forgot-password-1.html';
     return;
   }
   const otpCode = document.getElementById('otp-code').value.trim();
   
   fetch('http://127.0.0.1:8000/api/mobile/verify-otp', {
     method: 'POST',
     headers: { 'Content-Type': 'application/json' },
     body: JSON.stringify({ email: email, otp: otpCode, new_password: newPassword.value })
   })
   .then(r => r.json())
   .then(data => {
     if (data.status === 'success') {
       window.location.href = 'password-changed.html';
     } else {
       document.getElementById('otp-code-error').textContent = data.message;
       document.getElementById('otp-code').classList.add('field-error');
     }
   })
   .catch(err => {
     alert('Error connecting to server');
   });
  }
 });
</script>

<script src="translations.js"></script>
<script src="theme.js"></script>
</body>
</html>
