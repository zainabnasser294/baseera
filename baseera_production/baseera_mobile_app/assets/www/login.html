<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<link rel="stylesheet" href="styles.css">
<script>(function(){var t=localStorage.getItem("baseera-theme")||"light";document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("baseera-lang")||"en";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");})();</script>
<script>
 window.BASEERA_TRANSLATIONS = {
  loginHeading: { en: 'Hi,<br>Welcome to<br>Baseera', ar: 'أهلاً،<br>مرحبًا بك في<br>بصيرة' },
  loginSubtitle: { en: 'Sign in to your workspace', ar: 'سجّل الدخول إلى مساحة عملك' },
  labelEmail: { en: 'Username or Email', ar: 'اسم المستخدم أو البريد الإلكتروني' },
  labelPassword: { en: 'Password', ar: 'كلمة المرور' },
  rememberMe: { en: 'Remember Me', ar: 'تذكرني' },
  forgotPassword: { en: 'Forget Password ?', ar: 'نسيت كلمة المرور؟' },
  signInBtn: { en: 'Sign In &#8594;', ar: 'تسجيل الدخول &#8592;' },
  signupPrompt: { en: 'New to baseera? <a href="register.html">Create an account</a>', ar: 'جديد على بصيرة؟ <a href="register.html">أنشئ حسابًا</a>' },
  phEmail: { en: 'Username or name@company.com', ar: 'اسم المستخدم أو البريد الإلكتروني' },
  phPassword: { en: '••••••••', ar: '••••••••' }
 };
</script>
</head>
<body class="page-enter">

<div class="page">
 <div class="login-wrap">
  <div class="login-card">

   <h1 class="login-heading" data-i18n="loginHeading">Hi,<br>Welcome to<br>Baseera</h1>
   <p class="login-subtitle" data-i18n="loginSubtitle">Sign in to your workspace</p>

   <form id="login-form" novalidate>

    <label class="field-label" for="login-email" data-i18n="labelEmail">Username or Email</label>
    <div class="input-wrap">
     <span class="icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
     <input id="login-email" type="text" placeholder="Username or name@company.com" data-i18n-placeholder="phEmail" required>
    </div>
    <div class="error-message" id="login-email-error"></div>

    <label class="field-label" for="login-password" data-i18n="labelPassword">Password</label>
    <div class="input-wrap">
     <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor"/></svg></span>
     <input id="login-password" type="password" placeholder="••••••••" data-i18n-placeholder="phPassword" required>
     <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password"></button>
    </div>
    <div class="error-message" id="login-password-error"></div>

    <div class="login-options">
     <label class="remember-me">
      <input type="checkbox" id="remember-me">
      <span data-i18n="rememberMe">Remember Me</span>
     </label>
     <a class="forgot-link" href="forgot-password-1.html" data-i18n="forgotPassword">Forget Password ?</a>
    </div>

    <button type="submit" class="create-btn">
     <span data-i18n="signInBtn">Sign In <span class="arrow">&#8594;</span></span>
    </button>

    <p class="signup-link" data-i18n="signupPrompt">New to baseera? <a href="register.html">Create an account</a></p>

   </form>

  </div>
 </div>

</div>

<script src="script.js"></script>
<script>
 const loginForm = document.getElementById('login-form');

 const LOGIN_ERRORS = {
  en: { emailRequired: 'Please enter your email address.', emailInvalid: 'Please enter a valid email address.', passwordRequired: 'Please enter your password.' },
  ar: { emailRequired: 'الرجاء إدخال بريدك الإلكتروني.', emailInvalid: 'الرجاء إدخال بريد إلكتروني صحيح.', passwordRequired: 'الرجاء إدخال كلمة المرور.' }
 };

 function loginLang() {
  return document.documentElement.getAttribute('lang') || 'en';
 }

 loginForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const errs = LOGIN_ERRORS[loginLang()] || LOGIN_ERRORS.en;

  const email = document.getElementById('login-email');
  const password = document.getElementById('login-password');
  const emailError = document.getElementById('login-email-error');
  const passwordError = document.getElementById('login-password-error');

  email.classList.remove('field-error');
  password.classList.remove('field-error');
  emailError.textContent = '';
  passwordError.textContent = '';

  let isValid = true;
  const isValidEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());

  if (!email.value.trim()) {
   emailError.textContent = errs.emailRequired;
   email.classList.add('field-error');
   isValid = false;
  } else if (email.value.trim().includes('@') && !isValidEmail) {
   emailError.textContent = errs.emailInvalid;
   email.classList.add('field-error');
   isValid = false;
  }

  if (!password.value) {
   passwordError.textContent = errs.passwordRequired;
   password.classList.add('field-error');
   isValid = false;
  }

  if (isValid) {
   // Connect to Django backend
   fetch('http://127.0.0.1:8000/api/mobile/login', {
     method: 'POST',
     headers: {
       'Content-Type': 'application/json'
     },
     body: JSON.stringify({
       username: email.value.trim(),
       password: password.value
     })
   })
   .then(response => response.json())
   .then(data => {
     if (data.status === 'success') {
       localStorage.removeItem('baseera_datasets_list');
       localStorage.removeItem('basira_dataset');
       localStorage.removeItem('baseera_latest_analysis');
       localStorage.removeItem('baseera_upload_history');
       localStorage.setItem('basira_username', data.username);
       localStorage.setItem('basira_email', data.email);
       localStorage.setItem('basira_token', data.token);
       if (data.username === 'admin') {
         navigateWithConnectivityCheck('admin_dashboard.html');
       } else {
         navigateWithConnectivityCheck('dashboard.html');
       }
     } else {
      passwordError.textContent = data.message || ((loginLang() === 'ar') ? 'بيانات الاعتماد غير صحيحة' : 'Invalid credentials');
       passwordError.classList.add('field-error');
     }
   })
   .catch(error => {
     passwordError.textContent = 'Error connecting to server';
   });
  }
 });
</script>
<script src="translations.js"></script>
<script src="theme.js"></script>
</body>
</html>
