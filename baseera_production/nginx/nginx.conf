worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upstream configuration for Load Balancing & Reverse Proxy
    upstream backend_api {
        # Using host.docker.internal to reach .NET backend running on host
        server host.docker.internal:5000;
    }

    upstream frontend_web {
        # Flutter Web App
        server host.docker.internal:8080;
    }

    upstream django_dashboard {
        # Django Web Dashboard
        server host.docker.internal:8000;
    }

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        # Self-signed certificate paths (Update in production)
        # ssl_certificate /etc/ssl/certs/your_cert.crt;
        # ssl_certificate_key /etc/ssl/private/your_key.key;

        # Apply Rate Limiting globally for the server
        limit_req zone=api_limit burst=20 nodelay;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Route to .NET API
        location /api/ {
            proxy_pass http://backend_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route to Django Dashboard
        location /dashboard/ {
            proxy_pass http://django_dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route to Flutter Web (Default)
        location / {
            proxy_pass http://frontend_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
